# Vale configuration for fork docs prose linting.
#
# Scope is intentionally narrow: only the top-level user-facing prose
# files. Vale is opinionated; turning it loose on research docs,
# generated changelogs, or YAML produces enough false positives to
# drown the signal. We restrict it to the front-door docs where prose
# quality matters most.
#
# In CI this job is `continue-on-error: true` — findings show in the
# run log and as PR comments via reviewdog, but they do NOT fail the
# build. Promote rules to enforced once we've curated them against
# our writing style.

StylesPath = .vale/styles

MinAlertLevel = warning

# Vocab carves out project-specific terms (MemPalace, pgvector, etc.)
# that would otherwise trip generic spell/jargon rules. See
# .vale/styles/config/vocabularies/MemPalace/accept.txt.
Vocab = MemPalace

# Apply only to top-level prose docs. README is the front door,
# MISSION states the project promise, CONTRIBUTING is the contributor
# contract, SECURITY is policy. Everything else (changelogs, research,
# bibliographies, code-adjacent docs) is excluded by omission.
[README.md]
BasedOnStyles = Vale
# Spelling on a technical README with model names, library names,
# and homelab hostnames is pure noise — the Vocab can't cover every
# transient term. Disable; Repetition still catches real prose drift.
Vale.Spelling = NO

[MISSION.md]
BasedOnStyles = Vale
Vale.Spelling = NO

[CONTRIBUTING.md]
BasedOnStyles = Vale
Vale.Spelling = NO

[SECURITY.md]
BasedOnStyles = Vale
Vale.Spelling = NO
